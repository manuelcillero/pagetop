[package]
name = "pagetop-seaorm"
version = "0.0.4"

description = """
    Proporciona a PageTop acceso basado en SeaORM a bases de datos relacionales.
"""
categories = ["database", "development-tools", "asynchronous"]
keywords = ["pagetop", "database", "sql", "orm", "ssr"]

repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]
sqlite = ["sea-orm/sqlx-sqlite"]

[dependencies]
pagetop.workspace = true
sea-orm.workspace = true
sea-schema.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
# Las pruebas necesitan un motor real: SQLite en memoria. Sólo con `path` (sin versión), para que
# `cargo publish` la quite: con la versión buscaría el propio crate en crates.io.
pagetop-seaorm = { path = ".", features = ["sqlite"] }
