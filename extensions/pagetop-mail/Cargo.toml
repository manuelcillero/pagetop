[package]
name = "pagetop-mail"
version = "0.1.0"

description = """
    Envío de correo electrónico para aplicaciones PageTop: SMTP, plantillas, HTML y adjuntos.
"""
categories = ["email", "web-programming"]
keywords = ["pagetop", "email", "smtp", "mail", "ssr"]

repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
# Documenta también la API de la cola de envío (`Email::queue()`, `MailError::Queue`).
features = ["queue"]

[features]
# Cola de envío persistente en la base de datos, con reintentos y envío por lotes.
queue = ["dep:pagetop-cron", "dep:pagetop-seaorm"]

[dependencies]
pagetop.workspace = true
pagetop-cron = { workspace = true, optional = true }
pagetop-seaorm = { workspace = true, optional = true }
mime_guess.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dependencies.lettre]
workspace = true
features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "sendmail-transport",
    "file-transport",
    "tokio1-native-tls",
]

[dev-dependencies]
pagetop-seaorm = { workspace = true, features = ["sqlite"] }

[[test]]
name = "queue"
required-features = ["queue"]
